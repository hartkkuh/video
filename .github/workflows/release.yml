name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "package.json version is missing" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMP-Video-Player-Setup
          path: release/*.exe
          if-no-files-found: error

  publish:
    name: Release to ${{ matrix.target }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: hartkkuh/video
            use_release_token: false
          - target: hartkkuh/FMP-Media-Player
            use_release_token: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ matrix.target }}
          token: ${{ matrix.use_release_token && secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ needs.build.outputs.version }}
          name: FMP Video Player ${{ needs.build.outputs.version }}
          body_path: body.txt
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/FMP-Video-Player-Setup.exe
            release/*.blockmap
            release/latest.yml
