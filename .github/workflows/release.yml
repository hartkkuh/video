name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync update manifest
        run: npm run sync:update

      - name: Generate icons
        run: npm run icons

      - name: Build app
        run: npm run build

      - name: Package and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish always

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMP-Video-Player-Setup
          path: release/*.exe
          if-no-files-found: error
