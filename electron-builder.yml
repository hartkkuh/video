appId: com.fmp.videoplayer
productName: FMP Video Player
copyright: Copyright © FMP
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: build
publish:
  provider: github
  owner: hartkkuh
  repo: video
  releaseType: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: libvlc
    to: libvlc
    filter:
      - '**/*'
      - '!list.md'
asar: true
asarUnpack:
  - '**/node_modules/koffi/**/*'
fileAssociations:
  - ext:
      - mp4
      - m4v
      - mkv
      - avi
      - mov
      - wmv
      - webm
      - mpg
      - mpeg
      - mpe
      - flv
      - f4v
      - ts
      - m2ts
      - mts
      - 3gp
      - 3g2
      - ogv
      - asf
      - vob
      - divx
      - rm
      - rmvb
      - wtv
      - mxf
    name: FMP.Video
    description: Video File
    role: Viewer
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FMP Video Player
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  multiLanguageInstaller: true
  displayLanguageSelector: false
  installerLanguages:
    - en_US
    - he_IL
  runAfterFinish: true
  deleteAppDataOnUninstall: false
